name: github-plan

# This check is REQUIRED by branch protection once Chunk C adds it to
# homelab/locals.tf's required_status_check_contexts for the infrastructure
# repo (see docs/plans/2026-09-27-github-config-management.md). Not yet
# required today, but built to the same pattern homelab-plan.yml already
# uses so it's ready when that happens: the trigger is intentionally NOT
# path-filtered -- a path-filtered workflow that doesn't trigger leaves a
# required check stuck on "Expected — Waiting for status to be reported"
# forever, blocking PRs that never touch github/. Instead we always run the
# job and gate the expensive tofu steps on a path-detection -- a job whose
# steps are all skipped still reports success.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: github-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github

    env:
      TF_VAR_github_app_id: ${{ secrets.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id_personal: ${{ secrets.TF_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_installation_id_klavyn: ${{ secrets.TF_GITHUB_APP_INSTALLATION_ID_KLAVYN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      # Decide whether this PR actually touches the github context. When it
      # doesn't, every step below is skipped and the job reports a green
      # github-plan, satisfying branch protection without running tofu.
      - name: Detect github/ changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            github_ctx:
              - 'github/**'
              - '.github/workflows/github-plan.yml'

      - name: Stage GitHub App PEM
        if: steps.changes.outputs.github_ctx == 'true'
        run: |
          mkdir -p "$HOME/.config/github-app"
          printf '%s' "${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}" > "$HOME/.config/github-app/opentofu.pem"
          chmod 600 "$HOME/.config/github-app/opentofu.pem"
          echo "TF_VAR_github_app_pem_file=$HOME/.config/github-app/opentofu.pem" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@v1
        if: steps.changes.outputs.github_ctx == 'true'
        with:
          tofu_version: 1.10.0
          tofu_wrapper: false

      - name: tofu fmt -check
        if: steps.changes.outputs.github_ctx == 'true'
        run: tofu fmt -check -recursive

      - name: tofu init
        if: steps.changes.outputs.github_ctx == 'true'
        run: tofu init -input=false

      - name: tofu validate
        if: steps.changes.outputs.github_ctx == 'true'
        run: tofu validate

      - name: tofu plan
        id: plan
        if: steps.changes.outputs.github_ctx == 'true'
        run: |
          set +e
          tofu plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          status=${PIPESTATUS[0]}
          {
            echo 'plan<<EOF'
            sed 's/[\x1b]\[[0-9;]*[A-Za-z]//g' plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Post plan to PR
        if: always() && steps.changes.outputs.github_ctx == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = `${{ steps.plan.outputs.plan }}`;
            const max = 60000;
            const body = plan.length > max
              ? '### `github` tofu plan (truncated — see Actions log for full output)\n\n<details><summary>Plan output</summary>\n\n```hcl\n' + plan.slice(0, max) + '\n…\n```\n\n</details>'
              : '### `github` tofu plan\n\n<details><summary>Plan output</summary>\n\n```hcl\n' + plan + '\n```\n\n</details>';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
