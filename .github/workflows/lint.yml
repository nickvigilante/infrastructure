name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs the same hooks as the local pre-commit setup
  # (.pre-commit-config.yaml) so local and CI can't drift — tofu fmt,
  # mdformat, yamlfmt, yamllint, and the betterleaks secret scan. Fails if
  # any hook would modify a committed file. (mdformat + betterleaks + the
  # hygiene hooks are managed by pre-commit itself; only the language:system
  # hooks below need tools on PATH.)
  pre-commit:
    name: pre-commit (format + lint + secrets)
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the Go-built tool: feeds both the cache
      # key and `go install`, so a bump here rebuilds instead of restoring
      # a stale binary.
      YAMLFMT_VERSION: v0.21.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0
      # yamlfmt is compiled from source by `go install`, which dominates the
      # tool-install time -- cache the built binary instead.
      - name: Cache yamlfmt
        id: go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-yamlfmt-${{ env.YAMLFMT_VERSION }}
      - name: Build yamlfmt (cache miss only)
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go install "github.com/google/yamlfmt/cmd/yamlfmt@${YAMLFMT_VERSION}"
      - name: Install the other tools the repo:local hooks call
        run: |
          set -euo pipefail
          pip install yamllint==1.35.1 pre-commit
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # pre-commit builds a venv per hook repo (mdformat + its plugin, the
      # hygiene hooks) and compiles betterleaks. Keyed on the config, so any
      # hook `rev` or additional_dependencies change rebuilds them. The
      # interpreter hash guards against restoring venvs built by an older
      # runner Python.
      - name: Fingerprint the Python interpreter
        id: py
        run: echo "hash=$(python -VV | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.py.outputs.hash }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure
