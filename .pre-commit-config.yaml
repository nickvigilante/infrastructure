# Pre-commit hooks for the infrastructure repo. Mirrors the homelab repo's
# setup. Formats files and scans for secrets before each commit; the same
# hooks run in CI (.github/workflows/lint.yml) via `pre-commit run --all-files`,
# so local and CI can't drift.
#
# One-time local setup:
#   brew install pre-commit yamlfmt yamllint betterleaks opentofu
#   git config --unset core.hooksPath   # drop the old .githooks gitleaks hook
#   pre-commit install
#
# Formatter/linter per file type:
#   Terraform -> tofu fmt
#   Markdown  -> mdformat (+ mdformat-tables; CommonMark-strict, won't mangle
#                snake_case prose or rewrite embedded code blocks)
#   YAML      -> yamlfmt (format, see .yamlfmt) + yamllint (lint)
#   Secrets   -> betterleaks (replaces gitleaks)
#   All files -> whitespace / EOF / merge-conflict hygiene
# (.terraform.lock.hcl is generated — left untouched.)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--wrap, keep, --number]
        additional_dependencies:
          - mdformat-tables

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt (format Terraform)
        entry: tofu fmt -recursive
        language: system
        files: \.tf$
        pass_filenames: false
      - id: yamlfmt
        name: yamlfmt (format YAML)
        entry: yamlfmt -conf .yamlfmt
        language: system
        files: \.ya?ml$
      - id: yamllint
        name: yamllint
        entry: yamllint -c .github/yamllint.yml
        language: system
        files: \.ya?ml$

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks
